services:
  postgres:
    image: postgres:16
    container_name: dev-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=operaton
      - POSTGRES_USER=operaton
      - POSTGRES_PASSWORD=operaton
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - dev-shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operaton"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  dev-shared:
    external: true
